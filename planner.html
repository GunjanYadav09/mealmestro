<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner - MealMaestro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="bubbles">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>
        <div class="floating-food">
            <div class="food-item"><i class="fas fa-carrot"></i></div>
            <div class="food-item"><i class="fas fa-apple-alt"></i></div>
            <div class="food-item"><i class="fas fa-cheese"></i></div>
            <div class="food-item"><i class="fas fa-bread-slice"></i></div>
            <div class="food-item"><i class="fas fa-fish"></i></div>
            <div class="food-item"><i class="fas fa-egg"></i></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-utensils"></i>
                <a href="index.html" style="text-decoration: none; color: inherit;"><span>MealMaestro</span></a>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="pantry.html" class="nav-link">Virtual Pantry</a>
                <a href="planner.html" class="nav-link active">Meal Planner</a>
                <a href="recipes.html" class="nav-link">Recipes</a>
                <a href="shopping.html" class="nav-link">Shopping</a>
            </div>
            <div class="nav-actions">
                <button class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Meal Planner</h1>
            <p class="page-subtitle">Plan your meals for the week and get AI-generated suggestions</p>
        </div>
    </section>

    <!-- Page Content -->
    <section class="page-content">
        <div class="container">
            <div class="form-container">
                <div class="form-group">
                    <label for="week-selector" class="form-label">Select Week</label>
                    <input type="week" id="week-selector" class="form-control">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Dietary Preferences</label>
                    <div class="preferences-grid">
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="vegetarian"> Vegetarian
                        </label>
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="vegan"> Vegan
                        </label>
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="gluten-free"> Gluten-Free
                        </label>
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="dairy-free"> Dairy-Free
                        </label>
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="keto"> Keto
                        </label>
                        <label class="preference-option">
                            <input type="checkbox" name="diet" value="low-carb"> Low-Carb
                        </label>
                    </div>
                </div>
                
                <button class="btn btn-primary btn-block" id="generate-plan-btn">
                    <i class="fas fa-robot"></i> Generate Meal Plan
                </button>
            </div>

            <!-- Meal Calendar -->
            <div class="calendar-container" style="margin-top: 40px; display: none;" id="calendar-container">
                <h2 style="text-align: center; margin-bottom: 20px;">Your Meal Plan</h2>
                <div class="calendar" id="meal-calendar">
                    <!-- Calendar will be generated by JavaScript -->
                </div>
                
                <div class="calendar-actions" style="text-align: center; margin-top: 30px;">
                    <button class="btn btn-secondary" id="save-plan-btn">
                        <i class="fas fa-save"></i> Save Plan
                    </button>
                    <button class="btn btn-primary" id="shopping-list-btn">
                        <i class="fas fa-shopping-cart"></i> Generate Shopping List
                    </button>
                </div>
            </div>

            <!-- Shopping List Modal -->
            <div id="shopping-list-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <h2>Shopping List</h2>
                    <div id="shopping-list-content">
                        <!-- Shopping list will be generated here -->
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-primary" id="export-list-btn">
                            <i class="fas fa-download"></i> Export List
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <i class="fas fa-utensils"></i>
                    <span>MealMaestro</span>
                </div>
                <div class="footer-links">
                    <a href="https://github.com/yourusername" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/yourprofile" target="_blank" class="social-link">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>MADE BY GUNJAN YADAV</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
